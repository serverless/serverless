# One MCP server behind OIDC bearer-token enforcement, which also contributes
# the `/.well-known/oauth-protected-resource/...` discovery route.
#
# The issuer and audience arrive through the environment, deliberately without
# defaults: the suite reads them from the identity provider it uses (its ids are
# not knowable at authoring time) and sets them before invoking the CLI, and an
# unset variable has to fail while resolving the configuration rather than at
# runtime, where the entry would only report a token it cannot verify.
service: sfc-mcp-auth
frameworkVersion: '*'

provider:
  name: aws
  # The MCP SDK v2 requires Node.js 20 or newer.
  runtime: nodejs22.x
  # An edge-optimized REST endpoint cuts an idle connection at 30s, measured
  # from invoke rather than from the first byte, which kills a long tool call
  # whether it streams or not. Regional has no such limit.
  endpointType: REGIONAL

# Asked for explicitly: the zero-config predicate bundles a Node function only
# when its entry resolves to TypeScript, so a `.mjs` server takes the classic
# path unless a `build` block covers it. The emitted format follows the service
# package.json `type`, which is why this fixture declares `commonjs` while its
# own sources stay ESM `.mjs`.
build: esbuild

mcp:
  servers:
    secured:
      server: src/server.mjs
      timeout: 120
      auth:
        issuer: ${env:MCP_TEST_AUTH_ISSUER}
        audiences:
          - ${env:MCP_TEST_AUTH_AUDIENCE}

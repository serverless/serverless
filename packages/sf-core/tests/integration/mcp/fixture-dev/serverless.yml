# One stateful MCP server, driven by `mcp-dev.test.js` through `serverless dev`
# and then through a plain `serverless deploy`. The surface is deliberately
# minimal — a single `echo` tool that reports the module's MARKER — because what
# this fixture has to make observable is WHICH copy of the module answered, not
# what an MCP server can do (the sibling `../fixture/` covers that).
service: sfc-mcp-dev
frameworkVersion: '*'

provider:
  name: aws
  # The MCP SDK v2 requires Node.js 20 or newer.
  runtime: nodejs22.x
  # An edge-optimized REST endpoint cuts an idle connection at 30s, measured
  # from invoke rather than from the first byte, which kills a long tool call
  # whether it streams or not. Regional has no such limit.
  endpointType: REGIONAL

# Asked for explicitly: the zero-config predicate bundles a Node function only
# when its entry resolves to TypeScript, so a `.mjs` server takes the classic
# path unless a `build` block covers it. The emitted format follows the service
# package.json `type`, which is why this fixture declares `commonjs` while its
# own sources stay ESM `.mjs`.
build: esbuild

mcp:
  servers:
    crm:
      server: src/server.mjs
      # Kept even though no tool seals state: dev mode runs the server module in
      # a local child, and the key it needs is fetched per request from the
      # deployed secret — the `STATE_KEY_LEN` line below proves that fetch
      # reached the local process.
      state: true

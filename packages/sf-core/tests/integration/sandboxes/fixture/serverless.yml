service: sfc-sandboxes
org: serverlesstestaccount
frameworkVersion: '4'

provider:
  name: aws
  region: us-east-1
  environment:
    FROM_PROVIDER: inherited

sandboxes:
  echo:
    artifact: ./app
    minimumMemory: 2048
    environment:
      GREETING: hi
      PARAM_NAME: !Ref EchoParam
    hooks:
      ready: true
      run: true
    tags:
      purpose: integration
    observability:
      logs:
        retentionDays: 7

resources:
  Resources:
    EchoParam:
      Type: AWS::SSM::Parameter
      Properties:
        Type: String
        Value: gh-13876

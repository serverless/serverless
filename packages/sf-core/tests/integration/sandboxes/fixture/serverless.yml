service: sfc-sandboxes
org: serverlesstestaccount
frameworkVersion: '4'

provider:
  name: aws
  region: us-east-1
  environment:
    FROM_PROVIDER: inherited

# A function and a web app next to the sandbox: the three kinds of Lambda
# compute deploy, run and are removed together.
functions:
  hello:
    handler: handler.hello
    runtime: nodejs24.x

webApps:
  site:
    entry: web/server.mjs

sandboxes:
  echo:
    artifact: ./app
    package:
      patterns:
        - '!app/notes/**'
    minimumMemory: 2048
    environment:
      GREETING: hi
      PARAM_NAME: !Ref EchoParam
    hooks:
      ready: true
      run: true
    tags:
      purpose: integration
    observability:
      logs:
        retentionDays: 7

resources:
  Resources:
    EchoParam:
      Type: AWS::SSM::Parameter
      Properties:
        Type: String
        Value: gh-13876

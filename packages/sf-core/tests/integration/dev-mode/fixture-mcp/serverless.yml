# One stateful MCP server, served from the developer's machine by `serverless dev`
# (driven only by `mcp-dev.test.js`). `package.json`, `package-lock.json` and
# `src/server.mjs` are copies of the MCP suite's fixture (`../../mcp/fixture`),
# so the conformance checks assert the same server; this directory belongs to
# this one test file, as every fixture does.
service: devmode-mcp
frameworkVersion: '*'

provider:
  name: aws
  # The MCP SDK v2 requires Node.js 20 or newer.
  runtime: nodejs22.x
  # A regional REST endpoint has no 30s idle cut, so the long tool call can
  # stream for its whole ~36s.
  endpointType: REGIONAL

build: esbuild

mcp:
  servers:
    crm:
      server: src/server.mjs
      state: true
      timeout: 120

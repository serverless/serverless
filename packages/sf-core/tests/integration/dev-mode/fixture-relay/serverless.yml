service: devmode-relay

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-east-1

build:
  esbuild: false

functions:
  node:
    handler: handler.handler
    timeout: 20
    url: true
  stream:
    handler: stream.handler
    timeout: 20
    url:
      invokeMode: RESPONSE_STREAM
  python:
    handler: handler_py.handler
    runtime: python3.13
    architecture: x86_64
    timeout: 20

service: devmode-it

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64

build:
  esbuild: false

functions:
  node:
    handler: handler.handler
  python:
    handler: handler_py.handler
    runtime: python3.13
    architecture: x86_64
  ruby:
    handler: handler_rb.handler
    runtime: ruby3.4
  optOut:
    handler: handler.handler
  chained:
    handler: handler.handler
    environment:
      AWS_LAMBDA_EXEC_WRAPPER: /var/task/chain-wrapper.sh

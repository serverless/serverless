service: devmode-agent

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-east-1
  environment:
    # A value the suite generates per run: the handlers return its digest, which proves the
    # deployed environment reaches them, and the suite checks that it is never written under
    # .serverless/dev. The default keeps the other commands resolvable without it.
    FIXTURE_SECRET: ${env:DEV_MODE_FIXTURE_SECRET, 'unset'}

# One artifact per function: the TypeScript handler built by the Framework's esbuild support and
# the Python handler each ship in their own.
package:
  individually: true

functions:
  api:
    handler: src/api.handler
    timeout: 20
    url: true
  python:
    handler: handler_py.handler
    runtime: python3.13
    architecture: x86_64
    timeout: 20

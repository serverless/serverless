[project]
name = "sls-uv-test"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "flask==3.1.3",
  "bottle",
  "requests>=2.34.2",
]

[dependency-groups]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[project.optional-dependencies]
s3 = [
  "boto3==1.43.114",
]

[tool.uv.sources]
bottle = {git = "https://git@github.com/bottlepy/bottle.git", tag = "0.13.4"}

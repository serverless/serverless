name: 'CI: Framework CLI'

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      all-platforms:
        description: Also test on ARM Linux and Windows, as the release does
        type: boolean
        default: false
      platforms:
        description: >-
          Or a JSON array of runner labels to test on instead, for example
          ["windows-latest"]
        type: string
        default: ''
  pull_request:
    branches: [main]
    # The default types plus ready_for_review: the jobs skip drafts, so a
    # draft marked ready would otherwise stay untested
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'

jobs:
  lint:
    name: 'Lint'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Setup: Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Install: Dependencies'
        run: npm ci
      - name: 'Lint: ESLint'
        run: npm run lint
      - name: 'Lint: Prettier'
        run: npm run prettier
      - name: 'Lint: Agent Skills'
        run: node packages/sf-core/scripts/lint-skills.js

  test-engine:
    name: 'Test: Engine'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/engine
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Setup: Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Test: Engine Unit'
        run: npm test

  # Builds the release package the way the release workflow does and runs the
  # packaging checks the release runs before uploading it. The release
  # workflow only runs after merge, and main is published as canary within
  # minutes, so packaging breaks must be caught here.
  test-release-package:
    name: 'Test: Release Package'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Builds and checks files only; no AWS access, so no id-token.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./packages/sf-core
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Setup: Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      # A test build, so cached Go modules and build output are fine here; the
      # release jobs build the layers that ship without any cache.
      - name: 'Setup: Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dev-mode-bridge/go.mod
          cache-dependency-path: dev-mode-bridge/go.sum
      - name: 'Build: Dev Mode Layers'
        working-directory: ./packages/serverless
        run: npm run build:devmode:layer
      - name: 'Build: MCP Entry'
        working-directory: ./packages/serverless
        run: npm run build:mcp:entry
      - name: 'Build: Framework'
        run: npm run build
      - name: 'Build: Release Package'
        working-directory: ./packages/sf-core/scripts
        run: |
          node prepareDistributionTarballs.js
          cd ../../framework-dist
          bash ../sf-core/scripts/pack-framework-dist.sh
      - name: 'Test: Release Package'
        working-directory: ./packages/framework-dist
        run: |
          verify_dir=$(mktemp -d)
          tar -xzf serverlessinc-framework-alpha-*.tgz -C "${verify_dir}"
          bash ../sf-core/scripts/verify-release-package.sh "${verify_dir}/package"

  # The CLI from source, on Node.js 24 and 26, in a Docker network whose only
  # way out is a proxy: `serverless usage` signs in and reads the org's usage
  # from the Serverless API, so a request that ignores the proxy, or that a
  # Node.js version rejects through it, fails here. Only STS calls reach AWS.
  e2e-proxy:
    name: 'E2E: proxy-only network'
    if: ${{ !github.event.pull_request.draft }}
    # Docker containers run only on the Linux runners
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./packages/sf-core
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup: Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Setup: AWS Credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TEST1_ROLE_ARN }}
          aws-region: us-east-1
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Test: E2E in a network whose only way out is a proxy'
        env:
          SERVERLESS_ACCESS_KEY_DEV: ${{ secrets.SERVERLESS_ACCESS_KEY_DEV }}
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: tests/e2e/proxy-only-network.sh
      - name: 'Upload: Proxy log'
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-proxy-only-network-logs
          path: ${{ runner.temp }}/e2e-logs

  tests:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/test-framework.yml
    permissions:
      id-token: write
      contents: read
    secrets:
      SERVERLESS_LICENSE_KEY_DEV: ${{ secrets.SERVERLESS_LICENSE_KEY_DEV }}
      SERVERLESS_ACCESS_KEY_DEV: ${{ secrets.SERVERLESS_ACCESS_KEY_DEV }}
    with:
      # A manual run can test every platform the release tests, from any
      # branch; this workflow has no release jobs, so nothing can publish.
      platforms: ${{ inputs.platforms || (inputs.all-platforms && '["ubuntu-latest","ubuntu-24.04-arm","windows-latest"]') || '["ubuntu-latest"]' }}
      stage-prefix: pr-${{ github.event.pull_request.user.login || github.actor }}
      aws-sdk: '3'

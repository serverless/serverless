name: 'CI: Framework CLI'

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # The default types plus ready_for_review: the jobs skip drafts, so a
    # draft marked ready would otherwise stay untested
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'

jobs:
  lint:
    name: 'Lint'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Setup: Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Install: Dependencies'
        run: npm ci
      - name: 'Lint: ESLint'
        run: npm run lint
      - name: 'Lint: Prettier'
        run: npm run prettier
      - name: 'Lint: Agent Skills'
        run: node packages/sf-core/scripts/lint-skills.js

  test-engine:
    name: 'Test: Engine'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/engine
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Setup: Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Test: Engine Unit'
        run: npm test

  # Builds the release package the way the release workflow does and runs the
  # packaging checks the release runs before uploading it. The release
  # workflow only runs after merge, and main is published as canary within
  # minutes, so packaging breaks must be caught here.
  test-release-package:
    name: 'Test: Release Package'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Builds and checks files only; no AWS access, so no id-token.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./packages/sf-core
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Setup: Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Build: Minify Shim'
        run: |
          cd ../serverless/lib/plugins/aws/dev
          ../../../../../../node_modules/.bin/esbuild ./shim.js --bundle --platform=node --minify --outfile=./shim.min.js
      - name: 'Build: MCP Entry'
        working-directory: ./packages/serverless
        run: npm run build:mcp:entry
      - name: 'Build: Framework'
        run: npm run build
      - name: 'Build: Release Package'
        working-directory: ./packages/sf-core/scripts
        run: |
          node prepareDistributionTarballs.js
          cd ../../framework-dist
          bash ../sf-core/scripts/pack-framework-dist.sh
      - name: 'Test: Release Package'
        working-directory: ./packages/framework-dist
        run: |
          verify_dir=$(mktemp -d)
          tar -xzf serverlessinc-framework-alpha-*.tgz -C "${verify_dir}"
          bash ../sf-core/scripts/verify-release-package.sh "${verify_dir}/package"

  test-unit:
    name: 'Test: Unit'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/sf-core
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Setup: Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Test: Unit (sf-core)'
        run: npm run test:unit
      - name: 'Test: Unit (serverless)'
        working-directory: ./packages/serverless
        run: npm run test:unit
      - name: 'Test: Unit (mcp)'
        working-directory: ./packages/mcp
        run: npm run test:unit

  test-integration:
    name: 'Test: Integration (${{ matrix.leg }})'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # One leg per test account: separate runners lift the single-runner
    # ceiling and AWS rate limits stay per account. tests/integration/shards.json
    # says which suites run in which shard; suites that need the prerequisites
    # in TESTING.md are pinned to shard 1, which runs in test-1. fail-fast stays
    # off so one leg failing never cancels the others mid-deploy, and a flaky
    # leg can be re-run on its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: shard 1/3 · test-1
            role: ${{ vars.TEST1_ROLE_ARN }}
            command: npm run test -- --maxWorkers=8 --shard=1/3
            sdk: '3'
            needs-serverless-v3: true
          - leg: shard 2/3 · test-2
            role: ${{ vars.TEST2_ROLE_ARN }}
            command: npm run test -- --maxWorkers=8 --shard=2/3
            sdk: '3'
          - leg: shard 3/3 · test-3
            role: ${{ vars.TEST3_ROLE_ARN }}
            command: npm run test -- --maxWorkers=8 --shard=3/3
            sdk: '3'
          # The resolvers suite reads the same prerequisites and has always
          # run without SLS_AWS_SDK; an empty value reads the same as unset.
          - leg: resolvers · test-1
            role: ${{ vars.TEST1_ROLE_ARN }}
            command: npm run test:resolvers -- --maxWorkers=8
            sdk: ''
    defaults:
      run:
        working-directory: ./packages/sf-core
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Setup: Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Setup: AWS Credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.role }}
          aws-region: us-east-1
      # The sandbox suites build images from public.ecr.aws; signed-in pulls
      # aren't limited by the anonymous allowance that runners' shared IP
      # addresses exhaust.
      - name: 'Setup: ECR Public Login'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Build: Minify Shim'
        run: |
          cd ../serverless/lib/plugins/aws/dev
          ../../../../../../node_modules/.bin/esbuild ./shim.js --bundle --platform=node --minify --outfile=./shim.min.js
      - name: 'Build: Framework'
        run: npm run build
      # Only standalone-to-compose, which is pinned to shard 1, deploys with v3.
      - name: 'Install: Serverless v3'
        if: ${{ matrix.needs-serverless-v3 }}
        run: npm install -g serverless@3
      - name: 'Test: Integration'
        run: ${{ matrix.command }}
        env:
          SERVERLESS_LICENSE_KEY_DEV: ${{ secrets.SERVERLESS_LICENSE_KEY_DEV }}
          SERVERLESS_ACCESS_KEY_DEV: ${{ secrets.SERVERLESS_ACCESS_KEY_DEV }}
          TEST_STAGE: pr-${{ github.event.pull_request.user.login }}
          SLS_AWS_SDK: ${{ matrix.sdk }}
          AWS_MAX_ATTEMPTS: 7

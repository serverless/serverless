name: 'CI: Binary Installer'

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-binary-installer.yml'
      - 'binary-installer/**'

defaults:
  run:
    working-directory: ./binary-installer

jobs:
  test-binary-installer:
    name: 'Test: Binary Installer (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup: Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.27.0'
          cache-dependency-path: binary-installer/go.sum
      - name: 'Test: Unit'
        run: go test ./... -v -timeout 15m

  # Builds the release binaries exactly as the release workflow does, so the
  # e2e jobs test what users download (apart from the Windows signature).
  build-binary-installer:
    name: 'Build: Binary Installer'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup: Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.27.0'
          cache-dependency-path: binary-installer/go.sum
      - name: 'Build: Production'
        run: make build-prod
      - name: 'Upload: Production binaries'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-installer-prod
          path: binary-installer/dist/prod/
          if-no-files-found: error
          retention-days: 3

  e2e-binary-installer:
    name: 'Test: Binary Installer E2E (${{ matrix.os }})'
    needs: build-binary-installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup: Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.27.0'
          cache-dependency-path: binary-installer/go.sum
      - name: 'Setup: Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: 'Download: Production binaries'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-installer-prod
          path: ${{ runner.temp }}/launchers
      - name: 'Setup: Launcher under test'
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) target=linux-amd64 ;;
            Linux-ARM64) target=linux-arm64 ;;
            macOS-X64) target=darwin-amd64 ;;
            macOS-ARM64) target=darwin-arm64 ;;
            Windows-X64) target=windows-amd64 ;;
            *) echo "No release binary for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "E2E_LAUNCHER=${RUNNER_TEMP}/launchers/serverless-${target}" >> "$GITHUB_ENV"
      # Gives ~/.serverless/releases its own filesystem, as a bind mount or
      # volume does in a container, for TestConcurrentFirstRun_MountedReleasesDirectory.
      - name: 'Setup: Mounted releases directory'
        if: runner.os == 'Linux'
        run: |
          home="$RUNNER_TEMP/e2e-mounted-home"
          mkdir -p "$home/.serverless/releases"
          sudo mount -t tmpfs -o "size=3g,uid=$(id -u),gid=$(id -g)" tmpfs "$home/.serverless/releases"
          echo "E2E_MOUNTED_HOME=$home" >> "$GITHUB_ENV"
      - name: 'Test: E2E'
        run: go test -tags e2e ./e2e/ -v -count=1 -timeout 45m

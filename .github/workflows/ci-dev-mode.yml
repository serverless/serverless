name: 'CI: Dev Mode'

# The live Dev Mode suite deploys a service, runs `serverless dev` against it,
# and creates account-level resources under a test suffix (an IAM role, Lambda
# layer versions), so it is excluded from the default `npm test` fleet and runs
# here instead — only when something that can affect it changes. GitHub Actions
# has no job-level path filter, so the filter lives on this workflow's own
# triggers, the same way `CI: MCP Servers` scopes the MCP suite.
#
# A second job runs the suite's agent-loop file on Windows. It stops sessions with
# `serverless dev stop`, which reaches the session over its loopback control endpoint; the other
# files stop them with Ctrl+C (SIGINT), which Node turns into an immediate termination on
# Windows, so the restore they assert could not run there.

permissions:
  id-token: write
  contents: read

# The two path lists are duplicated rather than shared through a YAML anchor:
# GitHub Actions does not resolve anchors in workflow files. Keep them identical.
#
# Entries that are not Dev Mode-named but gate this suite all the same:
#   - `lib/plugins/esbuild/**` builds the handlers a session runs (the dev-build
#     interface lives on both sides);
#   - `lib/utils/dev-build-request.js` is that interface: `local/build.js` and the
#     esbuild plugin use it to decide which functions are built and reloaded;
#   - `lib/plugins/dev.js` registers the `dev` command and its subcommands. Their
#     options are declared in `lib/cli/commands-schema.js`, which is left out:
#     every command shares it, and a unit test pins the `dev` entries;
#   - the two `package.json` files hold `test:dev-mode`, `build:devmode:layer` and
#     `build:mcp:entry`, the commands this workflow runs;
#   - `lib/plugins/aws/mcp/**` and the MCP suite's client (`integration/mcp/lib/**`):
#     the suite deploys an MCP server and runs it in a session, and asserts it with
#     that client;
#   - `lib/classes/plugin-manager.js` registers the `dev` command's plugin;
#   - `lib/plugins/aws/info/endpoints.js` gives a session its endpoint lines and
#     resolves an imported HTTP API's endpoint;
#   - `lib/plugins/aws/common/lib/{artifacts,cleanup-temp-dir,serverless-dir}.js`
#     keep a session's `.serverless/dev/` when `package`, `deploy` and
#     `deploy function` empty `.serverless`, and `remove/lib/bucket.js` deletes the
#     stage's Dev Mode payload objects, which the suite's teardown checks;
#   - `runSfCore.js` and `testStageName.js` deploy and name every stack the suite
#     creates.
#   - the sf-core router, framework runner and CLI parser (`router.js`,
#     `runners/framework.js`, `utils/cli/cli.js`) route and prepare every Dev Mode
#     command: its options, positionals and the commands that read only local state.
#     The rest of `packages/sf-core/src` is left out: most changes there would run the
#     suite without touching Dev Mode.
#   - the shared `packages/util` modules a session runs on: `proxy` (the AWS IoT Core
#     connection, AWS clients and the dry run's connection check), `agent` (agent
#     detection), `cli/json-flag.js` (`--json`) and `forced-exit` (the second Ctrl+C).
#     The logger is left out: every command uses it, and its unit tests cover it.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # The default types plus ready_for_review: the job skips drafts, so a
    # draft marked ready would otherwise stay untested
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci-dev-mode.yml'
      - 'dev-mode-bridge/**'
      - 'packages/serverless/lib/classes/plugin-manager.js'
      - 'packages/serverless/lib/plugins/aws/common/lib/artifacts.js'
      - 'packages/serverless/lib/plugins/aws/common/lib/cleanup-temp-dir.js'
      - 'packages/serverless/lib/plugins/aws/common/lib/serverless-dir.js'
      - 'packages/serverless/lib/plugins/aws/dev/**'
      - 'packages/serverless/lib/plugins/aws/info/endpoints.js'
      - 'packages/serverless/lib/plugins/aws/mcp/**'
      - 'packages/serverless/lib/plugins/aws/remove/lib/bucket.js'
      - 'packages/serverless/lib/plugins/esbuild/**'
      - 'packages/serverless/lib/plugins/dev.js'
      - 'packages/serverless/lib/utils/dev-build-request.js'
      - 'packages/serverless/scripts/build-dev-layer.js'
      - 'packages/serverless/scripts/build-mcp-entry.js'
      - 'packages/serverless/package.json'
      - 'packages/sf-core/package.json'
      - 'packages/sf-core/src/lib/router.js'
      - 'packages/sf-core/src/lib/runners/framework.js'
      - 'packages/sf-core/src/utils/cli/cli.js'
      - 'packages/sf-core/tests/integration/dev-mode/**'
      - 'packages/sf-core/tests/integration/mcp/lib/**'
      - 'packages/sf-core/tests/utils/devMode.js'
      - 'packages/sf-core/tests/utils/devModeTestSuffix.js'
      - 'packages/sf-core/tests/utils/runSfCore.js'
      - 'packages/sf-core/tests/utils/testStageName.js'
      - 'packages/util/src/agent/**'
      - 'packages/util/src/cli/json-flag.js'
      - 'packages/util/src/forced-exit/**'
      - 'packages/util/src/proxy/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-dev-mode.yml'
      - 'dev-mode-bridge/**'
      - 'packages/serverless/lib/classes/plugin-manager.js'
      - 'packages/serverless/lib/plugins/aws/common/lib/artifacts.js'
      - 'packages/serverless/lib/plugins/aws/common/lib/cleanup-temp-dir.js'
      - 'packages/serverless/lib/plugins/aws/common/lib/serverless-dir.js'
      - 'packages/serverless/lib/plugins/aws/dev/**'
      - 'packages/serverless/lib/plugins/aws/info/endpoints.js'
      - 'packages/serverless/lib/plugins/aws/mcp/**'
      - 'packages/serverless/lib/plugins/aws/remove/lib/bucket.js'
      - 'packages/serverless/lib/plugins/esbuild/**'
      - 'packages/serverless/lib/plugins/dev.js'
      - 'packages/serverless/lib/utils/dev-build-request.js'
      - 'packages/serverless/scripts/build-dev-layer.js'
      - 'packages/serverless/scripts/build-mcp-entry.js'
      - 'packages/serverless/package.json'
      - 'packages/sf-core/package.json'
      - 'packages/sf-core/src/lib/router.js'
      - 'packages/sf-core/src/lib/runners/framework.js'
      - 'packages/sf-core/src/utils/cli/cli.js'
      - 'packages/sf-core/tests/integration/dev-mode/**'
      - 'packages/sf-core/tests/integration/mcp/lib/**'
      - 'packages/sf-core/tests/utils/devMode.js'
      - 'packages/sf-core/tests/utils/devModeTestSuffix.js'
      - 'packages/sf-core/tests/utils/runSfCore.js'
      - 'packages/sf-core/tests/utils/testStageName.js'
      - 'packages/util/src/agent/**'
      - 'packages/util/src/cli/json-flag.js'
      - 'packages/util/src/forced-exit/**'
      - 'packages/util/src/proxy/**'

# A cancelled run leaves its stack, role and layers behind until someone
# removes them, so runs of one ref queue instead of cancelling each other.
concurrency:
  group: ci-dev-mode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-dev-mode:
    name: 'Test: Dev Mode'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # The deployment role's sessions last at most an hour.
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ./packages/sf-core
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git credentials, so the GITHUB_TOKEN
          # stays out of .git/config.
          persist-credentials: false
      - name: 'Setup: Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Setup: Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dev-mode-bridge/go.mod
          cache: false
      # The suite's Python case skips without a Python 3.9+; fail here instead.
      - name: 'Check: Python'
        run: python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Build: Dev Mode Layers'
        working-directory: ./packages/serverless
        run: npm run build:devmode:layer
      # The suite deploys an MCP server, whose handler is this prebuilt entry.
      - name: 'Build: MCP Entry'
        working-directory: ./packages/serverless
        run: npm run build:mcp:entry
      # Only the tests get AWS credentials: installing and building need none.
      - name: 'Setup: AWS Credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TEST1_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600
      - name: 'Test: Dev Mode'
        run: npm run test:dev-mode
        env:
          SERVERLESS_LICENSE_KEY_DEV: ${{ secrets.SERVERLESS_LICENSE_KEY_DEV }}
          SERVERLESS_ACCESS_KEY_DEV: ${{ secrets.SERVERLESS_ACCESS_KEY_DEV }}
          TEST_STAGE: pr-${{ github.event.pull_request.user.login || github.actor }}
          AWS_MAX_ATTEMPTS: 7

  test-dev-mode-windows:
    name: 'Test: Dev Mode (Windows)'
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    # The deployment role's sessions last at most an hour.
    timeout-minutes: 50
    defaults:
      run:
        # bash rather than PowerShell, the Windows default, so the steps read the same as on Linux.
        shell: bash
        working-directory: ./packages/sf-core
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup: Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Setup: Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dev-mode-bridge/go.mod
          cache: false
      # Windows runners call it `python`, not `python3`; Dev Mode looks for either.
      - name: 'Setup: Python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # The suite's Python case skips without a Python 3.9+; fail here instead.
      - name: 'Check: Python'
        run: python -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Build: Dev Mode Layers'
        working-directory: ./packages/serverless
        run: npm run build:devmode:layer
      # Only the tests get AWS credentials: installing and building need none.
      - name: 'Setup: AWS Credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TEST1_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600
      - name: 'Test: Dev Mode agent loop'
        run: npm run test:dev-mode:agent-loop
        env:
          SERVERLESS_LICENSE_KEY_DEV: ${{ secrets.SERVERLESS_LICENSE_KEY_DEV }}
          SERVERLESS_ACCESS_KEY_DEV: ${{ secrets.SERVERLESS_ACCESS_KEY_DEV }}
          TEST_STAGE: pr-${{ github.event.pull_request.user.login || github.actor }}
          AWS_MAX_ATTEMPTS: 7

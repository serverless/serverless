name: 'Cleanup: Test Accounts'

# Reports what integration-test runs left behind in the test accounts: test
# stacks older than a day, and state-bucket keys of test stacks that no longer
# exist. It is a dry run and deletes nothing yet. The job summary is public,
# so it shows counts and the names of matched test stacks only; see
# packages/sf-core/scripts/test-account-cleanup/.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: cleanup-test-accounts
  cancel-in-progress: false

jobs:
  report:
    name: 'Report (${{ matrix.account }})'
    if: ${{ github.repository == 'serverless/serverless' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: test-1
            role: ${{ vars.TEST1_ROLE_ARN }}
          - account: test-2
            role: ${{ vars.TEST2_ROLE_ARN }}
          - account: test-3
            role: ${{ vars.TEST3_ROLE_ARN }}
    defaults:
      run:
        working-directory: ./packages/sf-core
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup: Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: 'Setup: Enable Corepack'
        run: corepack enable npm
      - name: 'Setup: AWS Credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.role }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: 'Install: Dependencies'
        run: |
          cd ../../
          npm ci
      - name: 'Report: Leftovers'
        run: node scripts/test-account-cleanup/report.js --regions us-east-1,us-east-2,eu-west-1
